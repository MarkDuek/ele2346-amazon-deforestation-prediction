[project]
name = "amazon-deforestation-prediction"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "h5py==3.14.0",
  "matplotlib==3.10.3",
  "numpy==2.2.5",
  "pyyaml==6.0.2",
  "segmentation-models-pytorch==0.5.0",
  "torch==2.7.1",
  "torchinfo==1.8.0",
  "torchmetrics==1.7.3",
  "tqdm==4.67.1",
]

[dependency-groups]
dev = [
  "black==25.1.0",
  "isort==6.0.1",
  "pytest==8.4.1",
]

[tool.black]
line-length = 79
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
